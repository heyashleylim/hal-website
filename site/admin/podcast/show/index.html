<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Show settings · Podcast admin</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/brand.css">
<link rel="stylesheet" href="/assets/css/admin/admin.css">
</head>
<body class="admin">
<a class="skip" href="#main">Skip to content</a>
<header class="admin-bar">
  <a class="admin-bar__title" href="/admin/podcast">Podcast admin</a>
  <nav class="admin-nav" aria-label="Admin menu"></nav>
  <a class="admin-bar__logout" href="/admin/logout">Log out</a>
</header>
<main id="main" class="admin-main">
  <h1>Show settings</h1>

  <section class="admin-card" aria-labelledby="art-title">
    <h2 id="art-title">Cover art</h2>
    <div class="admin-art">
      <img id="art" alt="Current cover art" width="160" height="160" hidden>
      <form id="art-form" class="admin-form">
        <p class="muted">Square JPEG or PNG, 1400–3000 pixels wide (Apple Podcasts requirement), under 5 MB.</p>
        <label class="admin-form__wide">Image file<input name="file" type="file" accept="image/jpeg,image/png" required></label>
        <div class="progress" hidden><span></span></div>
        <div class="admin-form__actions"><button class="btn-sm" type="submit">Upload cover art</button></div>
        <p class="admin-form__result" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>

  <section class="admin-card" aria-labelledby="show-title">
    <h2 id="show-title">Show</h2>
    <form id="form" class="admin-form" novalidate>
      <label class="admin-form__wide">Title <span class="hint">shown in podcast apps and on the subscribe page</span><input name="title" maxlength="200" required></label>
      <label class="admin-form__wide">Description<textarea name="description" maxlength="4000"></textarea></label>
      <label>Author<input name="author" maxlength="200"></label>
      <label>Owner email <span class="hint">in the feed, for Apple</span><input name="owner_email" type="email" maxlength="254"></label>
      <label>Category<input name="category" maxlength="100"></label>
      <label>Copyright<input name="copyright" maxlength="200"></label>
      <h3 class="admin-h3 admin-form__wide">Schedule and access</h3>
      <label>Release time <span class="hint">Seoul time, for every cohort</span><input name="release_time" type="time" required></label>
      <label>Days between modules <span class="hint">suggested release day for new modules</span><input name="drip_interval_days" type="number" min="0" max="60" required></label>
      <label>Access length (days) <span class="hint">from the cohort start; cohorts can override</span><input name="access_days" type="number" min="1" max="3650" required></label>
      <h3 class="admin-h3 admin-form__wide">Subscribe page and emails</h3>
      <label>Support email <span class="hint">shown to students</span><input name="support_email" type="email" maxlength="254"></label>
      <label>AC tag prefix <span class="hint">tags the site adds, e.g. prefix-subscribed</span><input name="ac_tag_prefix" maxlength="60" required autocapitalize="none" spellcheck="false"></label>
      <label class="admin-form__wide">Subscribe page intro <span class="hint">optional, Korean, shown under the title</span><textarea name="page_intro" maxlength="1000"></textarea></label>
      <div class="admin-form__actions"><button class="btn-sm" type="submit">Save settings</button></div>
      <p class="admin-form__result" role="status" aria-live="polite"></p>
    </form>
  </section>
</main>
<script src="/assets/js/admin/admin.js"></script>
<script>
(function () {
  var form = document.getElementById('form'), out = form.querySelector('.admin-form__result');
  var FIELDS = ['title', 'description', 'author', 'owner_email', 'category', 'copyright', 'release_time', 'drip_interval_days', 'access_days', 'support_email', 'ac_tag_prefix', 'page_intro'];

  function showArt(url) {
    var img = document.getElementById('art');
    img.hidden = !url;
    if (url) img.src = url;
  }

  Admin.get('show').then(function (r) {
    FIELDS.forEach(function (k) { form[k].value = r.show[k] == null ? '' : r.show[k]; });
    showArt(r.show.artwork_url);
  }).catch(function (err) { Admin.say(out, err.message, true); });

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var data = {};
    FIELDS.forEach(function (k) { data[k] = form[k].value; });
    var submit = form.querySelector('[type=submit]');
    submit.disabled = true;
    Admin.say(out, 'Saving…');
    Admin.post('show-save', data).then(function () { Admin.say(out, 'Saved.'); })
      .catch(function (err) { Admin.say(out, err.message, true); })
      .then(function () { submit.disabled = false; });
  });

  var art = document.getElementById('art-form'), aout = art.querySelector('.admin-form__result');
  var bar = art.querySelector('.progress'), fill = bar.firstElementChild;
  art.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var file = art.file.files[0];
    if (!file) { Admin.say(aout, 'Choose an image.', true); return; }
    var submit = art.querySelector('[type=submit]'), dims;
    submit.disabled = true;
    Admin.imageSize(file).then(function (d) {
      dims = d;
      if (d.width !== d.height || d.width < 1400 || d.width > 3000) throw new Error('This image is ' + d.width + '×' + d.height + '. It must be square, between 1400 and 3000 pixels wide.');
      bar.hidden = false;
      return Admin.upload(file, 'artwork', function (p) { fill.style.width = p + '%'; Admin.say(aout, 'Uploading… ' + p + '%'); });
    }).then(function (pathname) {
      return Admin.post('show-artwork', { pathname: pathname, width: dims.width, height: dims.height });
    }).then(function (r) {
      Admin.say(aout, 'Cover art updated. Podcast apps pick it up on their next refresh.');
      showArt(r.artwork_url);
      art.reset();
    }).catch(function (err) { Admin.say(aout, err.message, true); })
      .then(function () { submit.disabled = false; bar.hidden = true; fill.style.width = '0'; });
  });
})();
</script>
</body>
</html>
