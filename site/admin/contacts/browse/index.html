<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>All contacts · Contacts · Admin</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/brand.css">
<link rel="stylesheet" href="/assets/css/admin/admin.css">
</head>
<body class="admin" data-section="contacts">
<a class="skip" href="#main">Skip to content</a>
<header class="admin-bar"></header>
<main id="main" class="admin-main admin-main--wide">
  <h1>All contacts</h1>

  <form class="filters" id="filters" role="search">
    <label>Search <input type="search" name="q" placeholder="Name, email, phone or tag" maxlength="100"></label>
    <label>Tag <select name="tag"><option value="">All tags</option></select></label>
    <label>In ActiveCampaign <select name="status"><option value="">All</option><option value="in_ac">Still in AC</option><option value="gone">No longer in AC</option></select></label>
    <label>Linked to <select name="linked"><option value="">Anything</option><option value="student">A student record</option><option value="buyer">A paid shop order</option><option value="learning">Learning (courses)</option></select></label>
    <label>Sort by <select name="sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="updated">Recently changed</option><option value="name">Name</option><option value="email">Email</option></select></label>
    <button data-tip="Show the contacts that match the search and the filters" class="btn-sm" type="submit">Search</button>
    <button data-tip="Clear the search and every filter" class="btn-ghost" type="button" id="clear-filters">Reset</button>
  </form>

  <section class="admin-card" aria-label="Contacts">
    <p class="muted" id="count" role="status" style="margin-bottom:12px"></p>
    <div id="list" class="admin-scroll" aria-live="polite"><p class="admin-empty">Loading…</p></div>
    <p class="admin-actions" style="margin-top:16px">
      <button data-tip="Show the previous 100 contacts" class="btn-ghost" type="button" id="prev" hidden>← Previous 100</button>
      <button data-tip="Show the next 100 contacts" class="btn-ghost" type="button" id="next" hidden>Next 100 →</button>
    </p>
  </section>
</main>

<dialog class="reader" id="reader" aria-labelledby="reader-title">
  <div class="reader__bar">
    <span class="muted small">Contact</span>
    <button data-tip="Close this contact and go back to the list (Esc)" class="btn-ghost" type="button" id="close">Close</button>
  </div>
  <div class="reader__body" id="reader-body" tabindex="-1"></div>
</dialog>

<script src="/assets/js/admin/admin.js"></script>
<script>
(function () {
  var esc = Admin.esc;
  var form = document.getElementById('filters'), list = document.getElementById('list'), count = document.getElementById('count');
  var reader = document.getElementById('reader'), body = document.getElementById('reader-body');
  var FIELDS = ['q', 'tag', 'status', 'linked', 'sort'], offset = 0, contacts = [];
  var params = new URLSearchParams(location.search);

  function name(c) { return (c.first_name + ' ' + c.last_name).trim() || '<span class="muted">No name</span>'; }
  function values() {
    var v = {};
    FIELDS.forEach(function (f) { var x = form[f].value.trim(); if (x && !(f === 'sort' && x === 'newest')) v[f] = x; });
    return v;
  }
  function remember(openId) {
    var q = new URLSearchParams(values());
    if (offset) q.set('offset', offset);
    if (openId) q.set('open', openId);
    history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : ''));
  }
  function tags(list, max) {
    if (!list || !list.length) return '<span class="muted">–</span>';
    var shown = list.slice(0, max || 99);
    return '<span class="chips">' + shown.map(function (t) { return '<span class="badge">' + esc(t) + '</span>'; }).join('') +
      (list.length > shown.length ? '<span class="muted small">+' + (list.length - shown.length) + ' more</span>' : '') + '</span>';
  }

  function load(openId) {
    list.innerHTML = '<p class="admin-empty">Loading…</p>';
    return Admin.get('contacts-list', Object.assign({ offset: offset }, values())).then(function (r) {
      contacts = r.contacts;
      remember(openId);
      if (!r.all) { list.innerHTML = '<p class="admin-empty">No contact copied yet. Go to <a href="/admin/contacts/sync">ActiveCampaign sync</a> to start.</p>'; count.textContent = ''; return; }
      count.textContent = r.total === r.all ? r.total.toLocaleString('en-US') + ' contacts' : r.total.toLocaleString('en-US') + ' of ' + r.all.toLocaleString('en-US') + ' contacts';
      if (r.total > 100) count.textContent += ' · showing ' + (offset + 1) + '–' + Math.min(offset + 100, r.total);
      document.getElementById('prev').hidden = offset === 0;
      document.getElementById('next').hidden = offset + 100 >= r.total;
      if (!contacts.length) { list.innerHTML = '<p class="admin-empty">No contact matches. Try fewer filters.</p>'; return; }
      list.innerHTML = '<table class="admin-table"><thead><tr><th>Name</th><th>Email</th><th>Tags</th><th>Added to AC</th><th></th></tr></thead><tbody>' +
        contacts.map(function (c, i) {
          return '<tr data-i="' + i + '"><td><button data-tip="See everything about this contact" class="linkish" type="button">' + name(c) + '</button>' +
            (c.student_ids ? ' <span class="badge badge--info">Student</span>' : '') + '</td>' +
            '<td>' + esc(c.email) + '</td><td>' + tags(c.tags, 4) + '</td>' +
            '<td class="num">' + (c.ac_created_at ? Admin.kst(c.ac_created_at, false) : '–') + '</td>' +
            '<td>' + (c.gone_from_ac_at ? '<span class="badge badge--warn">No longer in AC</span>' : '') + '</td></tr>';
        }).join('') + '</tbody></table>';
      if (openId) open(openId);
    }).catch(function (err) { list.innerHTML = '<p class="is-error">' + esc(err.message) + '</p>'; });
  }

  function fact(label, value) { return '<div><dt>' + label + '</dt><dd>' + value + '</dd></div>'; }
  var STATUS = { paid: 'Paid', refunded: 'Refunded', partially_refunded: 'Partly refunded', refund_requested: 'Refund asked', awaiting_payment: 'Waiting for payment', created: 'Started', expired: 'Expired', cancelled: 'Cancelled' };

  function open(id) {
    body.innerHTML = '<p class="admin-empty">Loading…</p>';
    if (!reader.open) reader.showModal();
    remember(id);
    Admin.get('contacts-get', { id: id }).then(function (r) {
      var c = r.contact, fields = Object.keys(c.fields || {});
      body.innerHTML =
        '<h2 id="reader-title">' + name(c) + '</h2>' +
        '<p class="reader__meta">' + esc(c.email) + (c.phone ? ' · ' + esc(c.phone) : '') +
          (c.gone_from_ac_at ? ' · <span class="badge badge--warn">No longer in ActiveCampaign since ' + Admin.kst(c.gone_from_ac_at, false) + '</span>' : '') + '</p>' +
        '<dl class="facts">' +
          fact('Added to ActiveCampaign', c.ac_created_at ? Admin.kst(c.ac_created_at) : '–') +
          fact('Last changed in AC', c.ac_updated_at ? Admin.kst(c.ac_updated_at) : '–') +
          fact('Tags and fields read', c.details_at ? Admin.kst(c.details_at) : 'not yet (next sync)') +
          fact('ActiveCampaign id', esc(c.ac_id)) +
        '</dl>' +
        '<h3 class="admin-h3">Student record</h3>' +
        (r.students.length ? '<ul>' + r.students.map(function (s) {
          return '<li><a href="/admin/students/student?id=' + s.id + '">' + esc(s.name_en || s.name) + ' · ' + esc(s.program.toUpperCase()) + ' cohort ' + s.cohort + '</a>' +
            (s.persona ? ' · ' + esc(s.persona) : '') + (s.rating ? ' · testimonial ' + s.rating + '/5' : '') + '</li>';
        }).join('') + '</ul>' : '<p class="muted">None linked. Link one from the student’s page in Students.</p>') +
        '<h3 class="admin-h3">Shop orders <a class="small" href="/admin/shop/orders">(all orders)</a></h3>' +
        (r.orders.length ? '<table class="admin-table"><thead><tr><th>Order</th><th>Product</th><th>Total</th><th>Status</th><th>Date</th></tr></thead><tbody>' + r.orders.map(function (o) {
          return '<tr><td>#' + o.number + '</td><td>' + esc(o.product_name) + '</td><td class="num">' + Admin.money(o.total, o.currency) + '</td><td>' + esc(STATUS[o.status] || o.status) + '</td><td class="num">' + Admin.kst(o.paid_at || o.created_at, false) + '</td></tr>';
        }).join('') + '</tbody></table>' : '<p class="muted">No order on this site with this email.</p>') +
        '<h3 class="admin-h3">Learning <a class="small" href="/admin/podcast/students">(all Learning students)</a></h3>' +
        (r.learning.length ? '<ul>' + r.learning.map(function (s) {
          return '<li>' + esc(s.name || s.email) + (s.status === 'revoked' ? ' (access removed)' : '') +
            (s.enrollments.length ? ': ' + s.enrollments.map(function (e) { return esc(e.program + ' · ' + e.cohort) + (e.status === 'revoked' ? ' (revoked)' : ''); }).join(', ') : '') + '</li>';
        }).join('') + '</ul>' : '<p class="muted">Not in the student area.</p>') +
        '<h3 class="admin-h3">Tags</h3>' + tags(c.tags) +
        '<h3 class="admin-h3">Lists</h3>' + (c.lists && c.lists.length ? '<ul>' + c.lists.map(function (l) { return '<li>' + esc(l.name) + ' <span class="muted">· ' + esc(l.status) + '</span></li>'; }).join('') + '</ul>' : '<p class="muted">–</p>') +
        '<h3 class="admin-h3">Fields</h3>' + (fields.length ? '<dl class="facts">' + fields.sort().map(function (k) { return fact(esc(k), esc(c.fields[k])); }).join('') + '</dl>' : '<p class="muted">–</p>');
      body.scrollTop = 0;
    }).catch(function (err) { body.innerHTML = '<p class="is-error">' + esc(err.message) + '</p>'; });
  }

  list.addEventListener('click', function (ev) {
    var tr = ev.target.closest('tr[data-i]');
    if (tr) open(contacts[Number(tr.dataset.i)].id);
  });
  document.getElementById('close').addEventListener('click', function () { reader.close(); });
  reader.addEventListener('close', function () { remember(); });
  form.addEventListener('submit', function (ev) { ev.preventDefault(); offset = 0; load(); });
  ['tag', 'status', 'linked', 'sort'].forEach(function (f) { form[f].addEventListener('change', function () { offset = 0; load(); }); });
  document.getElementById('clear-filters').addEventListener('click', function () { form.reset(); offset = 0; load(); });
  document.getElementById('prev').addEventListener('click', function () { offset = Math.max(0, offset - 100); load(); });
  document.getElementById('next').addEventListener('click', function () { offset += 100; load(); });

  Admin.get('contacts-tags').then(function (r) {
    var sel = form.tag;
    sel.insertAdjacentHTML('beforeend', r.tags.map(function (t) { return '<option value="' + esc(t.tag) + '">' + esc(t.tag) + ' (' + t.n + ')</option>'; }).join(''));
    if (params.get('tag')) sel.value = params.get('tag');
  }).catch(function () {});
  FIELDS.forEach(function (f) { if (params.get(f)) form[f].value = params.get(f); });
  offset = Number(params.get('offset')) || 0;
  load(params.get('open'));
})();
</script>
</body>
</html>
